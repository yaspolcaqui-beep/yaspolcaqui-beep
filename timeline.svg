<svg width="800" height="130" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="800" height="130" rx="10" fill="#161b22"/>
  
  <!-- year labels -->
  <text x="20"  y="22" fill="#8b949e" font-size="11">2018</text>
  <text x="109" y="22" fill="#8b949e" font-size="11">2019</text>
  <text x="198" y="22" fill="#8b949e" font-size="11">2020</text>
  <text x="287" y="22" fill="#8b949e" font-size="11">2021</text>
  <text x="377" y="22" fill="#8b949e" font-size="11">2022</text>
  <text x="466" y="22" fill="#8b949e" font-size="11">2023</text>
  <text x="555" y="22" fill="#8b949e" font-size="11">2024</text>
  <text x="644" y="22" fill="#8b949e" font-size="11">2025</text>
  <text x="733" y="22" fill="#8b949e" font-size="11">2026</text>

  <!-- baseline -->
  <line x1="20" y1="28" x2="780" y2="28" stroke="#30363d" stroke-width="1"/>

  <!-- 3M: Jan 2018 – Mar 2022 -->
  <rect x="20"  y="32" width="378" height="34" rx="5" fill="#c0392b"/>
  <text x="30"  y="47" fill="white" font-size="11" font-weight="bold">3M Brazil</text>
  <text x="30"  y="59" fill="rgba(255,255,255,0.75)" font-size="9">Intern → LSS Trainee → Mkt Trainee → Specialist</text>

  <!-- Amazon Specialist: Mar 2022 – Jun 2024 -->
  <rect x="401" y="32" width="197" height="34" rx="5" fill="#e67e00"/>
  <text x="411" y="47" fill="white" font-size="11" font-weight="bold">Amazon</text>
  <text x="411" y="59" fill="rgba(255,255,255,0.75)" font-size="9">Marketing Specialist</text>

  <!-- Amazon Manager: Jun 2024 – Jun 2025 -->
  <rect x="601" y="32" width="89"  height="34" rx="5" fill="#b35900"/>
  <text x="608" y="47" fill="white" font-size="10" font-weight="bold">Amazon</text>
  <text x="608" y="59" fill="rgba(255,255,255,0.75)" font-size="9">Manager</text>

  <!-- MercadoLibre: Jun 2025 – present -->
  <rect x="693" y="32" width="85"  height="34" rx="5" fill="#ffe600"/>
  <text x="700" y="47" fill="#1a1a1a" font-size="9" font-weight="bold">MercadoLibre</text>
  <text x="700" y="59" fill="rgba(0,0,0,0.65)" font-size="9">PM · present</text>

  <!-- now indicator -->
  <line x1="778" y1="26" x2="778" y2="70" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="762"  y="82" fill="#58a6ff" font-size="9">now</text>

  <!-- legend -->
  <rect x="20"  y="95" width="10" height="10" rx="2" fill="#c0392b"/>
  <text x="34"  y="105" fill="#8b949e" font-size="10">3M (2018–2022)</text>
  <rect x="160" y="95" width="10" height="10" rx="2" fill="#e67e00"/>
  <text x="174" y="105" fill="#8b949e" font-size="10">Amazon (2022–2025)</text>
  <rect x="340" y="95" width="10" height="10" rx="2" fill="#ffe600"/>
  <text x="354" y="105" fill="#8b949e" font-size="10">MercadoLibre (2025–present)</text>
</svg>
